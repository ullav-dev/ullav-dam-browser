name: build_deploy

on:
  push:
    branches: main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test

  publish-dam-picker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@ullav-dev'
      - name: Publish @ullav-dev/dam-picker (if version is new)
        working-directory: packages/dam-picker
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm show @ullav-dev/dam-picker@$VERSION version 2>/dev/null || true)
          if [ -z "$PUBLISHED" ]; then
            echo "Publishing @ullav-dev/dam-picker@$VERSION"
            npm publish
          else
            echo "@ullav-dev/dam-picker@$VERSION already published, skipping"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Get commit hash
        id: commit
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
#      - name: Set up QEMU
#        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PAT_CLASSIC }}
      - name: Build and push
        uses: docker/build-push-action@v7
        env:
          BUILDKIT_PROGRESS: plain
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ullav-dev/ullav-dam-browser:${{ steps.commit.outputs.short }}
            ghcr.io/ullav-dev/ullav-dam-browser:latest
          secrets: |
            emailjs_service_id=${{ secrets.EMAILJS_SERVICE_ID }}
            emailjs_template_id=${{ secrets.EMAILJS_TEMPLATE_ID }}
            emailjs_public_key=${{ secrets.EMAILJS_PUBLIC_KEY }}
